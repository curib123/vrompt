services:
  vrompt-migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: migration
    image: ${VROMPT_MIGRATE_IMAGE:-vrompt-migrate:local}
    profiles:
      - migration
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@vrompt-postgres:5432/vrompt
    depends_on:
      vrompt-postgres:
        condition: service_healthy
    networks:
      - backend
