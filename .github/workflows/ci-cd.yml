name: Vrompt CI/CD

on:
  pull_request:
  push:
    branches: [main, development, production]

concurrency:
  group: vrompt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test, type-check, and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vrompt
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d vrompt"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vrompt
      REDIS_URL: redis://localhost:6379
      RUN_INTEGRATION_TESTS: 'true'
      JWT_ACCESS_SECRET: ci-only-access-secret-that-is-at-least-32-chars
      GOOGLE_CLIENT_ID: ci-client
      GOOGLE_CLIENT_SECRET: ci-secret
      GOOGLE_CALLBACK_URL: http://localhost:4000/api/v1/auth/google/callback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate --workspace @vrompt/api
      - run: npm run prisma:deploy --workspace @vrompt/api
      - run: npm run lint --workspace @vrompt/api
      - run: npm run lint --workspace @vrompt/web
      - run: npm run typecheck --workspace @vrompt/api
      - run: npm run typecheck --workspace @vrompt/web
      - run: npm test --workspace @vrompt/api
      - run: npm test --workspace @vrompt/web
      - run: npm run test:e2e --workspace @vrompt/api
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run web end-to-end tests
        env:
          START_E2E_SERVER: 'true'
        run: npm run test:e2e --workspace @vrompt/web
      - run: npm run build --workspace @vrompt/web
      - run: npm run build --workspace @vrompt/api

  production:
    name: Build and publish production images
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/vrompt
      IMAGE_TAG: ${{ github.sha }}
      SITE_URL: ${{ vars.VROMPT_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Require production site URL
        run: test -n "$SITE_URL"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/api:${{ env.IMAGE_TAG }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          target: migration
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/migrate:${{ env.IMAGE_TAG }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/web.Dockerfile
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=/api/v1
            NEXT_PUBLIC_SITE_URL=${{ env.SITE_URL }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/web:${{ env.IMAGE_TAG }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/nginx.Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/nginx:${{ env.IMAGE_TAG }}

  deployment:
    name: Deploy production images
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    needs: production
    runs-on: ubuntu-latest
    env:
      IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/vrompt
      IMAGE_TAG: ${{ github.sha }}
      DEPLOY_HOST: ${{ secrets.ORACLE_HOST || secrets.VPS_HOST }}
      DEPLOY_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY || secrets.VPS_SSH_KEY }}
      DEPLOY_USER: ${{ secrets.ORACLE_USER || secrets.VPS_USER }}
    steps:
      - name: Report unconfigured deployment
        if: env.DEPLOY_HOST == '' || env.DEPLOY_SSH_KEY == '' || env.DEPLOY_USER == ''
        run: echo "::notice::Oracle deployment skipped because ORACLE_HOST, ORACLE_SSH_KEY, and ORACLE_USER (or legacy VPS_* names) are not all configured."
      - name: Configure SSH
        if: env.DEPLOY_HOST != '' && env.DEPLOY_SSH_KEY != '' && env.DEPLOY_USER != ''
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/vrompt_deploy
          chmod 600 ~/.ssh/vrompt_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Deploy and verify
        if: env.DEPLOY_HOST != '' && env.DEPLOY_SSH_KEY != '' && env.DEPLOY_USER != ''
        run: |
          ssh -i ~/.ssh/vrompt_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /srv/vrompt && IMAGE_TAG=$IMAGE_TAG VROMPT_IMAGE_PREFIX=$IMAGE_PREFIX VROMPT_DEPLOY_BRANCH=production ./deploy.sh"
